name: Build + Auto-Approve

on: 
    pull_request:

permissions:
  pull-requests: write
  contents: write
jobs:

  production-build:
    uses: ./.github/workflows/production-build.yml

  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    needs: production-build
    if: needs.production-build.result == 'success' && (github.actor == 'renovate[bot]' || github.actor == 'dependabot[bot]')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: |
            ${{ secrets.PRIVATE_KEY }}
      - name: Auto Approve
        run: gh pr review --approve "$PR_URL" --body "Auto-approving PR as production build passed."
        env:
            PR_URL: ${{ github.event.pull_request.html_url }}
            GH_TOKEN: ${{ steps.generate-token.outputs.token }}
  merge:
    runs-on: ubuntu-latest
    needs: [auto-approve, production-build]
    permissions:
      pull-requests: write
      contents: write
    if: needs.auto-approve.result == 'success' && (github.actor == 'renovate[bot]' || github.actor == 'dependabot[bot]')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: |
            ${{ secrets.PRIVATE_KEY }}
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}