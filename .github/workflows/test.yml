name: Test

on:
 push:
    branches:
        - main
        - preview
 pull_request:
    branches:
        - main
        - preview
permissions:
  contents: read
jobs:
    test:
        runs-on: ubuntu-latest
        name: Test
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: 'app/.nvmrc'
            - name: Cache Yarn Packages
              uses: actions/cache@v6
              with:
                path: app/.yarn/cache
                key: ${{ runner.os }}-yarn-${{ hashFiles('app/yarn.lock') }}
                restore-keys: |
                  ${{ runner.os }}-yarn-
            - name: Install dependencies
              run: |
                cd app
                corepack enable
                yarn install --immutable
            - name: Run tests
              run: |
                cd app
                npm run test
            - name: Upload test results
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: test-results
                  path: app/test-results
            - name: Test Summary
              uses: test-summary/action@v2.6
              if: always()
              with:
                paths: app/test-results/results.xml
    lint:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v7
        - name: Set up Node.js
          uses: actions/setup-node@v7
          with:
              node-version-file: 'app/.nvmrc'
        - name: Cache Yarn Packages
          uses: actions/cache@v6
          with:
              path: app/.yarn/cache
              key: ${{ runner.os }}-yarn-${{ hashFiles('app/yarn.lock') }}
              restore-keys: |
                ${{ runner.os }}-yarn-
        - name: Install dependencies
          run: |
            cd app
            corepack enable
            yarn install --immutable
        - name: Run ESLint
          run: |
            cd app
            if npx ng lint --format summary; then
              echo "✅ Linting passed - 0 problems" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ Linting failed - see errors above" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
    docker-build-test:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v7
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4
        - name: Build Docker image
          uses: docker/build-push-action@v7
          with:
            context: .
            file: ./production.Dockerfile
            push: false
            load: true
            tags: website:test
        - name: Smoke test container
          run: |
            docker run --rm -d --name website-test -p 8080:80 website:test
            sleep 5
            curl -f http://127.0.0.1:8080/ >/tmp/website.html
            docker rm -f website-test
