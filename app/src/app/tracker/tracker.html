<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Airport Visit Tracker</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        input, button { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background: #0070f3; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0051a2; }
        .visit-card { background: #f4f4f4; padding: 10px; margin: 10px 0; border-radius: 4px; }
        hr { margin: 20px 0; border: 0; border-top: 1px solid #ddd; }
    </style>
</head>
<body>
    <h2>Log Airport Visit</h2>
    <form id="visitForm">
        <!-- New Token Input Field -->
        <input type="password" id="apiToken" placeholder="API Secret Token" required>
        <hr>
        <input type="text" id="username" placeholder="Your Username (e.g., Charlie)" required>
        <input type="text" id="iata_code" placeholder="IATA Code (e.g., LHR)" required>
        <input type="text" id="airport_name" placeholder="Airport Name (Optional)">
        <input type="date" id="visit_date" required>
        <input type="text" id="notes" placeholder="Notes (Optional)">
        <button type="submit">Add Visit</button>
    </form>

    <h2>Logged Visits</h2>
    <div id="visitsList">Loading...</div>

    <script>
        const API_URL = '/api/visits';

        async function loadVisits() {
            try {
                const res = await fetch(API_URL);
                const visits = await res.json();
                const container = document.getElementById('visitsList');
                
                if (visits.length === 0) {
                    container.innerHTML = '<p>No visits logged yet.</p>';
                    return;
                }

                container.innerHTML = visits.map(v => `
                    <div class="visit-card">
                        <strong>${v.iata_code}</strong> (${v.airport_name || 'Unknown Airport'})<br>
                        <small>Visited by: ${v.username || 'Anonymous'} on ${v.visit_date}</small>
                        ${v.notes ? `<p>${v.notes}</p>` : ''}
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('visitsList').innerText = 'Failed to load visits.';
            }
        }

        document.getElementById('visitForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Grab the token typed into the new input field
            const token = document.getElementById('apiToken').value;

            const data = {
                username: document.getElementById('username').value,
                iata_code: document.getElementById('iata_code').value.toUpperCase(),
                airport_name: document.getElementById('airport_name').value,
                visit_date: document.getElementById('visit_date').value,
                notes: document.getElementById('notes').value
            };

            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}` // Dynamically passes your typed token
                },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                // Keep the token in the form so you don't have to re-type it every time, but clear the rest
                document.getElementById('username').value = '';
                document.getElementById('iata_code').value = '';
                document.getElementById('airport_name').value = '';
                document.getElementById('visit_date').value = '';
                document.getElementById('notes').value = '';
                
                loadVisits();
            } else {
                alert('Unauthorized: Invalid token or failed to log visit.');
            }
        });

        loadVisits();
    </script>
</body>
</html>
